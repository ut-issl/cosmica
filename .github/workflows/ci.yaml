name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.x"
  UV_FROZEN: "1"
  UV_NO_SYNC: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install ruff
        run: uv sync --only-group ruff

      - name: Run ruff
        run: uv run -- ruff check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --no-dev --group typing

      - name: Run mypy
        run: uv run -- mypy .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --no-dev --group typing

      - name: Run ty
        run: uv run -- ty check --output-format=github

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --no-dev --group typing

      - name: Run Pyrefly
        run: uv run -- pyrefly check --output-format=github

  import-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --dev

      - name: Run import-linter
        run: uv run -- lint-imports

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      # Override `.python-version` so uv uses the matrix interpreter.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --no-dev --group test --group examples

      - name: Run pytest
        run: uv run -- coverage run -m pytest --import-mode importlib

      - name: Generate coverage report
        run: |
          uv run -- coverage report -m
          uv run -- coverage xml -o ./coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Verify the declared lower bounds of the runtime dependencies on the minimum supported Python.
  pytest-lowest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Install the project with the lowest direct dependencies
        run: |
          uv venv
          uv pip install --resolution lowest-direct . --group test --group examples

      - name: Run pytest
        run: uv run -- pytest --import-mode importlib

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --no-dev --group docs

      - name: Generate docs
        run: uv run -- scripts/gen_index_page.py

      - name: Build docs
        run: uv run -- zensical build --strict

  pip-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --no-dev --group license

      - name: Check licenses
        run: uv run -- pip-licenses

  deptry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync --dev

      - name: Run deptry
        run: uv run -- deptry .

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@v3.1.0
        with:
          # Follow the prek version bundled with the action (updated by Renovate).
          prek-version: latest-known
          # no-commit-to-branch fails on pushes to main.
          extra-args: --all-files --skip=no-commit-to-branch

  actions-lock:
    name: Verify actions lockfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify .github/workflows/actions.lock
        # release.yaml is intentionally not onboarded; see the comment at its top.
        shell: bash
        run: >-
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name release.yaml -print0
          | sort -z
          | xargs -0 gh actions-lock --verify

  collect:
    if: ${{ always() }}
    needs: [ruff, mypy, ty, pyrefly, import-linter, build-docs, pytest, pytest-lowest, pip-licenses, deptry, prek, actions-lock]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
